name: pcapdoctor check
description: Fail the job when a packet capture shows network problems
branding:
  icon: activity
  color: red

inputs:
  captures:
    description: Capture files to check, separated by spaces or newlines; globs work
    required: true
  fail-on:
    description: Filters to fail on, one per line (packet fields or finding.*)
    default: finding.severity == error

runs:
  using: composite
  steps:
    # Pinned to a release (uses: anishmehta24/pcapdoctor@v0.1.0), the action
    # downloads that release's binary. Otherwise (@main, or a commit) it
    # builds pcapdoctor from the action's source, which takes about a minute.
    - name: Get pcapdoctor
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        dir="$RUNNER_TEMP/pcapdoctor"
        if [ -e "$dir/bin/pcapdoctor" ] || [ -e "$dir/bin/pcapdoctor.exe" ]; then
          exit 0
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-gnu archive=tar.xz ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu archive=tar.xz ;;
          macOS-X64) target=x86_64-apple-darwin archive=tar.xz ;;
          macOS-ARM64) target=aarch64-apple-darwin archive=tar.xz ;;
          Windows-X64) target=x86_64-pc-windows-msvc archive=zip ;;
          *) target= ;;
        esac
        download() {
          local name="pcapdoctor-$target.$archive"
          local url="https://github.com/anishmehta24/pcapdoctor/releases/download/$ACTION_REF/$name"
          local tmp="$RUNNER_TEMP/pcapdoctor-download"
          mkdir -p "$tmp" "$dir/bin" && cd "$tmp" || return 1
          curl -fsSLO "$url" && curl -fsSLO "$url.sha256" || return 1
          if command -v sha256sum > /dev/null; then
            sha256sum -c "$name.sha256" || return 1
          else
            shasum -a 256 -c "$name.sha256" || return 1
          fi
          case "$archive" in
            zip) unzip -q -o "$name" ;;
            *) tar -xJf "$name" ;;
          esac
          find . -type f \( -name pcapdoctor -o -name pcapdoctor.exe \) -exec cp {} "$dir/bin/" \;
          [ -e "$dir/bin/pcapdoctor" ] || [ -e "$dir/bin/pcapdoctor.exe" ]
        }
        if [[ "$ACTION_REF" =~ ^v[0-9] ]] && [ -n "$target" ] && download; then
          exit 0
        fi
        cargo install --locked --quiet --path "$GITHUB_ACTION_PATH" --root "$dir"

    - name: Check captures
      shell: bash
      env:
        CAPTURES: ${{ inputs.captures }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        bin="$RUNNER_TEMP/pcapdoctor/bin/pcapdoctor"
        args=()
        while IFS= read -r filter; do
          [ -n "$filter" ] && args+=(--fail-on "$filter")
        done <<< "$FAIL_ON"
        set -f
        patterns=($CAPTURES)
        set +f
        shopt -s nullglob
        files=()
        for pattern in "${patterns[@]}"; do
          matched=($pattern)
          if [ ${#matched[@]} -eq 0 ]; then
            echo "::error::no capture matches $pattern"
            exit 2
          fi
          files+=("${matched[@]}")
        done
        status=0
        "$bin" check "${files[@]}" "${args[@]}" --format github --color never || status=$?
        for file in "${files[@]}"; do
          printf '```\n%s\n```\n' "$("$bin" "$file" --color never)" >> "$GITHUB_STEP_SUMMARY"
        done
        exit $status
