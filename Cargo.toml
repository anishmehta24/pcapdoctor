[package]
name = "pcapdoctor"
version = "0.1.0"
edition = "2024"
description = "Reads a packet capture and tells you what went wrong, in plain English"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/anishmehta24/pcapdoctor"
keywords = ["pcap", "network", "tcp", "dns", "diagnostics"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
libloading = "0.9.0"
regex-lite = "0.1.9"

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
